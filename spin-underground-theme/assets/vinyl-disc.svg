<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Radial sheen on vinyl grooves -->
    <radialGradient id="vinylShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="45%" stop-color="#0c0c0c" />
      <stop offset="47%" stop-color="#2a2a2a" />
      <stop offset="50%" stop-color="#0e0e0e" />
      <stop offset="68%" stop-color="#242424" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="90%" stop-color="#222222" />
      <stop offset="98%" stop-color="#080808" />
      <stop offset="100%" stop-color="#141414" />
    </radialGradient>
    <!-- Specular highlight cones -->
    <linearGradient id="specularCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)" />
    </linearGradient>
  </defs>

  <!-- Outer Vinyl Edge -->
  <circle cx="250" cy="250" r="246" fill="#0d0d0d" stroke="#333" stroke-width="2" />
  
  <!-- Grooved Surface -->
  <circle cx="250" cy="250" r="240" fill="url(#vinylShine)" />

  <!-- Concentric Groove Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#222" stroke-width="0.75" opacity="0.6" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.7" />
  <circle cx="250" cy="250" r="200" fill="none" stroke="#262626" stroke-width="0.75" opacity="0.6" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#1e1e1e" stroke-width="0.5" opacity="0.8" />
  <circle cx="250" cy="250" r="170" fill="none" stroke="#2a2a2a" stroke-width="0.75" opacity="0.5" />
  <circle cx="250" cy="250" r="155" fill="none" stroke="#181818" stroke-width="0.5" opacity="0.7" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="#282828" stroke-width="0.75" opacity="0.6" />
  <circle cx="250" cy="250" r="125" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.8" />
  <circle cx="250" cy="250" r="110" fill="none" stroke="#222" stroke-width="0.75" opacity="0.7" />

  <!-- Light Refraction Highlight Cones -->
  <path d="M 250 250 L 75 75 A 240 240 0 0 1 180 20 Z" fill="url(#specularCone)" />
  <path d="M 250 250 L 425 425 A 240 240 0 0 1 320 480 Z" fill="url(#specularCone)" />

  <!-- Run-out Groove -->
  <circle cx="250" cy="250" r="100" fill="#111" stroke="#222" stroke-width="1.5" />

  <!-- Center Label Outer Ring -->
  <circle cx="250" cy="250" r="88" fill="#ff005b" opacity="0.9" />
  <!-- Center Label Body -->
  <circle cx="250" cy="250" r="84" fill="#0f0f0f" stroke="#ff005b" stroke-width="2" />
  
  <!-- Center Label Details -->
  <circle cx="250" cy="250" r="76" fill="none" stroke="#333" stroke-dasharray="2 3" />
  
  <!-- Center Text Arc / Brand -->
  <text x="250" y="210" font-family="'Montserrat', sans-serif" font-weight="900" font-size="13" fill="#ff005b" text-anchor="middle" letter-spacing="3">SPIN UNDERGROUND</text>
  <text x="250" y="226" font-family="'Montserrat', sans-serif" font-weight="600" font-size="9" fill="#aaa" text-anchor="middle" letter-spacing="2">33 ⅓ RPM • STEREO</text>
  <text x="250" y="285" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9" fill="#fff" text-anchor="middle" letter-spacing="1.5">HEAVYWEIGHT VINYL</text>
  <text x="250" y="299" font-family="'Montserrat', sans-serif" font-weight="500" font-size="8" fill="#ff005b" text-anchor="middle" letter-spacing="2">FINLAND</text>

  <!-- Center Spindle Hole -->
  <circle cx="250" cy="250" r="18" fill="#ff005b" opacity="0.4" />
  <circle cx="250" cy="250" r="14" fill="#000" stroke="#444" stroke-width="1.5" />
</svg>
